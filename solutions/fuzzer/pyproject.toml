[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzer"
version = "0.1.0"
description = "Coverage-based fuzzer"
requires-python = ">=3.13"
dependencies = [
  "jpamb",
]

[project.scripts]
fuzzer-interpreter = "dynamic:interpret"
fuzzer-analysis = "dynamic:analyse"
fuzzer = "fuzzer:main"
fuzzer-checks = "checks:main"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]
