[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzer"
version = "0.1.0"
description = "Coverage-based fuzzer"
requires-python = ">=3.13"
dependencies = [
  "jpamb",
  "syntactic",
]

[project.scripts]
fuzzer-interpreter = "dynamic:interpret"
fuzzer-analysis = "dynamic:analyse"
fuzzer = "fuzzer:main"
fuzzer-checks = "checks:main"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }
syntactic = { path = "../syntactic", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "pytest>=9.1.1",
]

[tool.ruff]
extend = "../../pyproject.toml"
# jpamb and jvm are imported last, as in the rest of the repo.
src = ["../../src"]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# fuzzer.py writes a crash row for any exception.
"src/fuzzer.py" = ["BLE001"]
# Line length is not checked in teammates' files.
"src/dynamic.py" = ["E501"]
