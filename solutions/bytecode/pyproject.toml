[project]
name = "bytecode-dynamic"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jpamb",
]

[project.scripts]
jvm-dynamic = "jvm_dynamic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["jvm_dynamic.py"]

[tool.uv.sources]
jpamb = { path = "../..", editable = true }
