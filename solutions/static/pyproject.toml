[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "static"
version = "0.1.0"
description = "The interval analysis that gives the fuzzer its bound, and the scripts that run and summarize the evaluation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fuzzer",
  "jpamb",
  "syntactic",
]


[project.scripts]
static-interpreter = "static:interpret"
static-analysis = "static:analyse"
fuzzer-with-bound = "evaluation:main"
fuzzer-extension = "extension:main"
fuzzer-results = "results:main"
fuzzer-jvm-check = "jvm_check:main"

[tool.uv.sources]
fuzzer = { path = "../fuzzer", editable = true }
jpamb = { path = "../../", editable = true }
syntactic = { path = "../syntactic", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "pytest>=9.1.1",
]

[tool.ruff]
extend = "../../pyproject.toml"
# jpamb and jvm are imported last, as in the rest of the repo.
src = ["../../src"]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# extension.py writes an error row for any exception.
"src/extension.py" = ["BLE001"]
# The lattice tests compare a value with itself on purpose.
"src/tools.py" = ["PLR0124"]
# The file's own test runner prints FAIL for any exception.
"tests/test_interval_outliers_abs.py" = ["BLE001", "PLR0124"]
# unbounded.py answers maybe to every query when the analysis fails.
"src/unbounded.py" = ["BLE001"]
